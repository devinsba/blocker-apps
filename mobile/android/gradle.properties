org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ABIs to build libblocker_jni.so for. Must match what scripts/build-android.sh
# produced under blocker-core/src/main/jniLibs-static/. For a quick emulator
# build use e.g. blocker.abis=x86_64 (and ABIS=x86_64 scripts/build-android.sh).
blocker.abis=arm64-v8a,armeabi-v7a,x86_64,x86
