# XcodeGen spec for the Blocker iOS/iPadOS app.
#
#   brew install xcodegen
#   scripts/build-ios-xcframework.sh          # from the repo root; needs full Xcode
#   cd mobile/ios && xcodegen generate && open Blocker.xcodeproj
#
# Blocker.xcodeproj is generated and git-ignored; edit this file instead.
# Set DEVELOPMENT_TEAM (below or in Xcode) and, if you change bundleIdPrefix,
# update the App Group id in every *.entitlements file and in
# Shared/SharedConfig.swift, and the tunnel bundle id in Blocker/ProtectionView.swift.
name: Blocker

options:
  bundleIdPrefix: dev.blocker
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  BlockerKit:
    # Uses ../Frameworks/BlockerFFI.xcframework when present (see BlockerKit/Package.swift).
    path: BlockerKit

targets:
  Blocker:
    type: application
    platform: iOS
    sources:
      - path: Blocker
      - path: Shared
    dependencies:
      - package: BlockerKit
        product: BlockerKit
      - target: BlockerFilter
        embed: true
      - target: BlockerTunnel
        embed: true
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.blocker.ios
        PRODUCT_NAME: Blocker
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Blocker/Info.plist
        CODE_SIGN_ENTITLEMENTS: Blocker/Blocker.entitlements
        SUPPORTS_MACCATALYST: NO

  # Content filter for supervised (MDM-managed) devices.
  BlockerFilter:
    type: app-extension
    platform: iOS
    sources:
      - path: BlockerFilter
      - path: Shared
    dependencies:
      - package: BlockerKit
        product: BlockerKit
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.blocker.ios.filter
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: BlockerFilter/Info.plist
        CODE_SIGN_ENTITLEMENTS: BlockerFilter/BlockerFilter.entitlements
        SKIP_INSTALL: YES

  # DNS-filtering packet tunnel for consumer devices.
  BlockerTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: BlockerTunnel
      - path: Shared
    dependencies:
      - package: BlockerKit
        product: BlockerKit
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.blocker.ios.tunnel
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: BlockerTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: BlockerTunnel/BlockerTunnel.entitlements
        SKIP_INSTALL: YES

schemes:
  Blocker:
    build:
      targets:
        Blocker: all
    run:
      config: Debug
    archive:
      config: Release
