[package]
name = "blocker-filter"
version.workspace = true
edition.workspace = true
license.workspace = true

# The content filter is a macOS Network Extension; on other platforms the
# binary is a stub that exits with an error.
[target.'cfg(target_os = "macos")'.dependencies]
anyhow = "1.0.104"
block2 = "0.6"
blocker-core.workspace = true
dispatch2 = "0.3"
log = "0.4"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-network-extension = "0.3"
oslog = "0.2.0"
