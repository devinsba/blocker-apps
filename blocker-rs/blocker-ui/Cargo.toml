[package]
name = "blocker-ui"
description = "Menu-bar app for Blocker: tray icon showing whether blocking is active, and a status window"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde_json = "1"
blocker-core = { path = "../blocker-core" }
rune = { git = "https://github.com/anomalyco/rune", rev = "631e8a67cb3c40225efa3f6c4f57b80e7b18f190", default-features = false, features = ["accessibility", "embedded-fonts", "metal-backend", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "631e8a67cb3c40225efa3f6c4f57b80e7b18f190" }

# Rune's Linux tray speaks StatusNotifierItem over D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "631e8a67cb3c40225efa3f6c4f57b80e7b18f190", default-features = false, features = ["dbus"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
tempfile = "3"
